spring:
  application:
    name: payguard-core-api

  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:payguard_core}
    username: ${DB_USER:payguard_user}
    password: ${DB_PASSWORD:payguard_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

logging:
  level:
    com.payguard: DEBUG
